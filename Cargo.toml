[package]
name = "portmirage"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Every service on a quiet, stable, random port in one registry, with decoys where scanners look"
license = "MIT"
repository = "https://github.com/cybercoretech/portmirage"
keywords = ["ports", "registry", "systemd", "self-hosted", "security"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
